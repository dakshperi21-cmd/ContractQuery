<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>polymarket-lookup</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230a0a0a%22/><text x=%2250%22 y=%2270%22 font-size=%2260%22 text-anchor=%22middle%22 fill=%22%23ffb300%22 font-family=%22monospace%22>$</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="winbar">
      <span class="dot dot-r"></span>
      <span class="dot dot-y"></span>
      <span class="dot dot-g"></span>
      <span class="winbar-title">polymarket-lookup</span>
      <span class="winbar-auth" id="auth-area"></span>
    </div>
    <div class="brand-row">
      <h1 class="brand-heading">
        <button type="button" id="brand-home" class="brand" title="Back to home">
          <span class="prompt">$</span> contract<span class="cursor">_</span>
        </button>
      </h1>
      <p class="tagline">// query any Polymarket contract — live odds, volume, liquidity</p>
    </div>
  </header>

  <main>
    <section class="search-panel">
      <div class="search-row">
        <form id="search-form" autocomplete="off">
          <label class="search-label" for="search-input">query&gt;</label>
          <input
            id="search-input"
            type="text"
            placeholder="fed rate decision / trump / bitcoin $150k …"
            aria-label="Search Polymarket contracts"
          />
          <button type="submit">run</button>
        </form>
        <button type="button" id="home-btn" class="home-btn" title="Back to home">home</button>
      </div>
      <div id="search-status" class="status" aria-live="polite"></div>
    </section>

    <section id="recents-panel" class="recents-panel hidden" aria-live="polite">
      <div class="recents-header">
        <span>recents</span>
        <button type="button" id="recents-close" class="recents-close" title="Close">[x]</button>
      </div>
      <div id="recents-list" class="recents-list"></div>
    </section>

    <section id="results" class="results" aria-live="polite"></section>

    <section id="detail" class="detail hidden" aria-live="polite"></section>
  </main>

  <footer>
    <span>data: polymarket public gamma + clob api</span>
    <span class="footer-sep">·</span>
    <span>unaffiliated, unofficial</span>
    <span class="footer-sep">·</span>
    <span>not financial advice</span>
  </footer>

  <div id="auth-modal" class="modal-overlay hidden">
    <div class="modal">
      <button type="button" id="auth-modal-close" class="modal-close" title="Close">[x]</button>
      <div class="modal-tabs">
        <button type="button" id="tab-login" class="modal-tab active">login</button>
        <button type="button" id="tab-signup" class="modal-tab">sign up</button>
      </div>
      <form id="auth-form" autocomplete="off">
        <label class="modal-label" for="auth-username">username&gt;</label>
        <input id="auth-username" type="text" autocomplete="username" required />
        <label class="modal-label" for="auth-password">password&gt;</label>
        <input id="auth-password" type="password" autocomplete="current-password" required />
        <div id="auth-error" class="modal-error"></div>
        <button type="submit" id="auth-submit" class="modal-submit">log in</button>
      </form>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
